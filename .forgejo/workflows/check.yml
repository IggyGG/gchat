name: Native validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [gcoms-linux-x64, gcoms-windows-x64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: gchat
          fetch-depth: 0
      # Qualify the unpublished SDK additions against an immutable source pair.
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ghost-local/gcoms
          ref: b6f9bb084daf40a54f33c7284bede1ef6b98f3fb
          path: gcoms
          persist-credentials: false
      - run: python3 gchat/scripts/ci.py --gcoms gcoms
        env:
          CARGO_BUILD_JOBS: '2'
