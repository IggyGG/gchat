# cargo-deny policy for the GChat developer preview. Run: cargo deny check
#
# Every duplicated major version doubles the audit and patch surface of a
# primitive we rely on. Duplicates are denied by default; the exceptions below
# are the openmls/hpke tree, which pins a newer RustCrypto generation than
# the rest of the workspace. Remove each skip when the workspace catches up.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained build-time macro via ratatui 0.29, not a runtime vulnerability. Reviewed 2026-09-17; migrate to a compatible maintained ratatui generation before the next preview." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 2.0.1 is build-time-only through hax-lib-macros 0.3.7 in OpenMLS/libcrux. Upstream has no replacement release; reviewed 2026-09-17, revisit before the next preview. No runtime vulnerability is waived." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots trust data; license bundled under third-party/
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    # Custom or unmaintained cryptography is forbidden (SPEC §8.1).
    { crate = "openssl", reason = "Native node TLS selects aws-lc; no OpenSSL backend" },
    { crate = "ring", wrappers = ["rustls-webpki", "rustls"], reason = "Ring is confined to the reviewed rustls/reqwest TLS dependency path" },
]
skip = [
    { crate = "hashbrown@0.15.5", reason = "ratatui lru uses hashbrown 0.15 while indexmap uses 0.17; revisit with terminal dependency upgrades" },
    { crate = "linux-raw-sys@0.4.15", reason = "crossterm rustix 0.38 and private filesystem rustix 1 use separate system bindings; revisit with terminal dependency upgrades" },
    { crate = "rustix@0.38.44", reason = "crossterm retains rustix 0.38; private filesystem code uses rustix 1; revisit with terminal dependency upgrades" },
    { crate = "unicode-width@0.1.14", reason = "ratatui unicode-truncate retains width 0.1 alongside width 0.2; revisit with terminal dependency upgrades" },
    { crate = "windows-sys@0.59.0", reason = "crossterm rustix 0.38 uses windows-sys 0.59 alongside newer runtime bindings; revisit with terminal dependency upgrades" },

    { crate = "block-buffer@0.12.1", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "chacha20@0.10.2", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "const-oid@0.10.2", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "cpufeatures@0.3.1", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "crypto-common@0.2.2", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "curve25519-dalek@5.0.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "der@0.8.2", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "digest@0.11.3", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "fiat-crypto@0.3.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "getrandom@0.4.3", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "hkdf@0.13.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "hmac@0.13.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "pkcs8@0.11.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "rand@0.10.2", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "rand_chacha@0.10.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "rand_core@0.10.1", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "sha2@0.11.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "sha3@0.12.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "shlex@2.0.1", reason = "cc and bindgen use different parser major versions" },
    { crate = "signature@3.0.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "spki@0.8.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
    { crate = "syn@3.0.5", reason = "derive dependencies use syn 3 while remaining proc macros use syn 2" },
    { crate = "windows-sys@0.52.0", reason = "ring retains windows-sys 0.52; current runtime crates use 0.61" },
    { crate = "x25519-dalek@3.0.0", reason = "RustCrypto and OpenMLS HPKE require parallel audited API generations; revisit with their next compatible upgrades" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
