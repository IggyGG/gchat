name: Retained Mac network diagnosis
run-name: Mac network diagnosis ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [macos-aarch64, macos-x86_64]
      request_id: {type: string, required: true}
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ${{ inputs.target == 'macos-aarch64' && 'macos-15' || 'macos-15-intel' }}
    environment: release-signing
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Validate artifact refusal cases
        run: PYTHONPATH=scripts:scripts/tests python3 -m unittest macos_network_retained_test native_network_test -v
      - name: Original signed installer, original deadlines, aggregate counters
        env:
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
          GCHAT_NETWORK_INVITATION: ${{ secrets.GCHAT_NETWORK_INVITATION }}
        run: python3 scripts/macos-network-retained.py --target "$TARGET" --output retained-network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.target }}-retained-network-${{ inputs.request_id }}
          path: |
            retained-network/summary.json
            retained-network/original-run.json
            retained-network/original-artifact.json
            retained-network/diagnostic.log
            retained-network/diagnostic/**
          retention-days: 30
