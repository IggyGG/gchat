name: Stable contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r release/automation/requirements.txt
      - run: python3 scripts/check-source.py
      - run: python3 scripts/check_contracts.py
      - name: Complete Python source gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD 'HEAD^{tree}' > evidence/source.txt
          python3 -m unittest discover -s scripts/tests -p '*_test.py' 2>&1 | tee evidence/python.log
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-gates
          path: evidence/
          if-no-files-found: ignore
