name: Retained mobile acceptance
run-name: Native acceptance ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      target:
        required: true
        type: choice
        options: [android, ios]
      gchat_commit:
        required: true
        type: string
      release_manifest:
        required: true
        type: string
      artifacts:
        required: true
        type: string
      invitation_secret:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ${{ fromJSON('{"android":"ubuntu-24.04","ios":"macos-15"}')[inputs.target] }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Bind immutable mobile inputs
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          ARTIFACTS: ${{ inputs.artifacts }}
          REQUEST: ${{ inputs.request_id }}
          INVITATION_SECRET: ${{ inputs.invitation_secret }}
          EXPECTED_COMMIT: ${{ inputs.gchat_commit }}
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import base64,json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_pair import canonical,validate
          from mobile_acceptance_inputs import validate_inputs
          assert re.fullmatch('[0-9a-f]{64}',os.environ['REQUEST'])
          assert re.fullmatch('GCHAT_ACCEPTANCE_[0-9A-F]{64}',os.environ['INVITATION_SECRET'])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_COMMIT']
          manifest=validate(json.loads(base64.b64decode(os.environ['RELEASE_MANIFEST'],validate=True)))
          assert manifest['sources']['gchat']['commit']==os.environ['EXPECTED_COMMIT']
          inputs=validate_inputs(json.loads(base64.b64decode(os.environ['ARTIFACTS'],validate=True)))
          assert inputs['target']==os.environ['TARGET']
          assert inputs['current']['sources']=={k:v['commit'] for k,v in manifest['sources'].items()}
          Path('acceptance-manifest.json').write_bytes(canonical(manifest))
          Path('acceptance-inputs.json').write_bytes(canonical(inputs))
          PY
      - name: Prepare Android and retained Linux peer tools
        if: inputs.target == 'android'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk libpulse0 libnss3 libxkbcommon0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 gnupg
          echo 'JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$GITHUB_ENV"
          echo '/usr/lib/jvm/java-17-openjdk-amd64/bin' >> "$GITHUB_PATH"
          python - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_network_canary import module
          android=module('android-build')
          manager=Path(os.environ['ANDROID_HOME'])/'cmdline-tools/latest/bin/sdkmanager'
          environment=dict(os.environ,JAVA_HOME='/usr/lib/jvm/java-17-openjdk-amd64')
          subprocess.run([str(manager),'platform-tools','emulator','build-tools;'+android.BUILD_TOOLS,
                          'system-images;android-35;google_apis;x86_64'],
                         input='y\n'*100,text=True,check=True,env=environment,timeout=900)
          PY
          gpg --batch --import release/signers/linux-release.asc
          sudo chmod a+rw /dev/kvm
      - name: Prepare pinned iOS test tools
        if: inputs.target == 'ios'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.2'
          brew install xcodegen
      - name: Test retained signed applications through actual mobile UI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GCHAT_NETWORK_INVITATION: ${{ secrets[inputs.invitation_secret] }}
        run: |
          python scripts/test-mobile-upgrade.py --inputs acceptance-inputs.json --manifest acceptance-manifest.json --output acceptance
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-${{ inputs.request_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            acceptance/report.json
            acceptance/rollback/report.json
            acceptance/network/report.json
