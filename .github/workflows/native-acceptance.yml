name: Retained native acceptance
run-name: Native acceptance ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      target:
        required: true
        type: choice
        options: [linux-x86_64, windows-x86_64, macos-aarch64, macos-x86_64]
      gchat_commit:
        required: true
        type: string
      qualification_commit:
        required: false
        type: string
      release_manifest:
        required: true
        type: string
      artifacts:
        required: true
        type: string
      invitation_secret:
        required: false
        type: string
      delivery_url:
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-24.04","windows-x86_64":"windows-2022","macos-aarch64":"macos-15","macos-x86_64":"macos-15-intel"}')[inputs.target] }}
    environment: release-signing
    timeout-minutes: 45
    env:
      REQUEST: ${{ inputs.request_id }}
      DELIVERY_URL: ${{ inputs.delivery_url }}
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.qualification_commit || inputs.gchat_commit }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Bind immutable native inputs
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          ARTIFACTS: ${{ inputs.artifacts }}
          REQUEST: ${{ inputs.request_id }}
          INVITATION_SECRET: ${{ inputs.invitation_secret }}
          EXPECTED_COMMIT: ${{ inputs.gchat_commit }}
          QUALIFICATION_COMMIT: ${{ inputs.qualification_commit || inputs.gchat_commit }}
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import base64,json,os,re,subprocess,sys,urllib.parse
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_pair import canonical,validate,identity
          assert re.fullmatch('[0-9a-f]{64}',os.environ['REQUEST'])
          if os.environ['DELIVERY_URL']:
              url=urllib.parse.urlsplit(os.environ['DELIVERY_URL'])
              assert url.scheme=='https' and url.hostname and not any((url.username,url.password,url.query,url.fragment))
              assert not os.environ['INVITATION_SECRET']
          else:
              assert re.fullmatch('GCHAT_ACCEPTANCE_[0-9A-F]{64}',os.environ['INVITATION_SECRET'])
          source=identity(Path('.'))
          assert source['commit']==os.environ['QUALIFICATION_COMMIT']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          manifest=validate(json.loads(base64.b64decode(os.environ['RELEASE_MANIFEST'],validate=True)))
          assert manifest['sources']['gchat']['commit']==os.environ['EXPECTED_COMMIT']
          inputs=json.loads(base64.b64decode(os.environ['ARTIFACTS'],validate=True))
          assert inputs['target']==os.environ['TARGET']
          Path('acceptance-manifest.json').write_bytes(canonical(manifest))
          Path('acceptance-inputs.json').write_bytes(canonical(inputs))
          Path('acceptance-worker.json').write_bytes(canonical({
              'schema':1,'request':os.environ['REQUEST'],'release_id':manifest['release_id'],
              'sources':manifest['sources'],'target':inputs['target'],**source}))
          PY
      - name: Prepare Linux installed application dependencies
        if: inputs.target == 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb xauth gnupg
      - name: Publish readiness from this running worker
        if: inputs.delivery_url != ''
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          python scripts/acceptance_delivery.py ready --request "$REQUEST" --private "$RUNNER_TEMP/gchat-acceptance-$REQUEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.delivery_url != ''
        with:
          name: acceptance-ready-${{ inputs.request_id }}
          path: acceptance-ready.json
          retention-days: 30
          if-no-files-found: error
      - name: Test retained applications without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GCHAT_NETWORK_INVITATION: ${{ secrets[inputs.invitation_secret] }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$DELIVERY_URL" ]; then
            command=(python scripts/acceptance_delivery.py run --request "$REQUEST" --private "$RUNNER_TEMP/gchat-acceptance-$REQUEST" --url "$DELIVERY_URL" --driver scripts/test-native-upgrade.py --output acceptance)
          else
            command=(python scripts/test-native-upgrade.py --inputs acceptance-inputs.json --manifest acceptance-manifest.json --output acceptance)
          fi
          if [ "$TARGET" = linux-x86_64 ]; then
            gpg --batch --import release/signers/linux-release.asc
            xvfb-run -a "${command[@]}"
          else
            "${command[@]}"
          fi
          git diff --exit-code
      - name: Remove this worker's private delivery key and archive copies
        if: always() && inputs.delivery_url != ''
        shell: bash
        run: |
          python - <<'PY'
          import os,re,shutil
          from pathlib import Path
          request=os.environ['REQUEST']; assert re.fullmatch('[0-9a-f]{64}',request)
          root=Path(os.environ['RUNNER_TEMP'])/('gchat-acceptance-'+request)
          assert not root.is_symlink()
          if root.exists(): shutil.rmtree(root)
          assert not root.exists()
          PY
      - name: Retain the independent qualification source binding
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_pair import canonical,identity
          source=Path('acceptance-worker.json')
          if source.is_file():
              binding=json.loads(source.read_text())
              binding['source_unchanged']=(identity(Path('.'))=={k:binding[k] for k in ('commit','tree')}
                  and subprocess.run(['git','diff','--quiet','HEAD']).returncode==0)
              Path('acceptance').mkdir(exist_ok=True)
              Path('acceptance/worker.json').write_bytes(canonical(binding))
              assert binding['source_unchanged']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-${{ inputs.request_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            acceptance/worker.json
            acceptance/report.json
            acceptance/delivery.json
            acceptance/*.stdout
            acceptance/*.stderr
            acceptance/cleanup-*/*.stdout
            acceptance/cleanup-*/*.stderr
            acceptance/rollback/*.json
            acceptance/rollback/*.log
            acceptance/network/*.json
            acceptance/network/*.log
