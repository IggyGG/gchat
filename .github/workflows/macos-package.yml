name: macOS package retry
run-name: Forgejo macOS package ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [macos-aarch64, macos-x86_64]
      gchat_commit:
        description: Original native-qualified application commit
        required: true
        type: string
      gcoms_commit:
        description: Original native-qualified protocol commit
        required: true
        type: string
      native_run_id:
        required: true
        type: string
      artifact_id:
        description: Immutable target artifact from the original run
        required: true
        type: string
      artifact_sha256:
        description: GitHub SHA-256 of the original artifact ZIP
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    environment: release-signing
    runs-on: ${{ inputs.target == 'macos-aarch64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 210
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact original native artifact and source pair
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          GCHAT_COMMIT: ${{ inputs.gchat_commit }}
          GCOMS_COMMIT: ${{ inputs.gcoms_commit }}
          TARGET: ${{ inputs.target }}
        run: >-
          python3 controller/scripts/macos-package.py prepare
          --gchat gchat --gcoms gcoms --target "$TARGET" --output retry-evidence
          --native-run-id "$NATIVE_RUN_ID" --artifact-id "$ARTIFACT_ID"
          --artifact-sha256 "$ARTIFACT_SHA256" --gchat-commit "$GCHAT_COMMIT" --gcoms-commit "$GCOMS_COMMIT"
      - name: Preflight protected signing certificate import
        timeout-minutes: 2
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TARGET: ${{ inputs.target }}
        run: >-
          python3 controller/scripts/macos-package.py preflight
          --gchat gchat --gcoms gcoms --target "$TARGET" --output retry-evidence
      - name: Install original pinned native build prerequisites
        timeout-minutes: 15
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, tomllib
          from pathlib import Path
          toolchains = [tomllib.loads(Path(name, 'rust-toolchain.toml').read_text())['toolchain'] for name in ('gchat', 'gcoms')]
          if toolchains[0] != toolchains[1]:
              raise SystemExit('paired sources must select the same pinned Rust toolchain')
          toolchain = toolchains[0]
          subprocess.run(['rustup', 'toolchain', 'install', toolchain['channel'], '--profile', toolchain.get('profile', 'minimal'),
                          '--component', ','.join(toolchain['components'])], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RUSTUP_TOOLCHAIN=' + toolchain['channel'] + '\n')
              scratch = Path(tempfile.mkdtemp(prefix='gc-', dir='/private/tmp')).resolve()
              scratch.chmod(0o700)
              for name in ('TMPDIR', 'TMP', 'TEMP'):
                  output.write(name + '=' + str(scratch) + '\n')
          PY
          xcrun --sdk macosx --show-sdk-path
          clang --version
          brew install node@22 cmake
          echo "$(brew --prefix node@22)/bin" >> "$GITHUB_PATH"
      - name: Package unchanged native-qualified application with bound controller helper
        timeout-minutes: 140
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TARGET: ${{ inputs.target }}
        run: |
          npm install --global npm@11
          python3 controller/scripts/macos-package.py package --target "$TARGET" --gchat gchat --gcoms gcoms --output retry-evidence --signed signed 2>&1 | tee retry-evidence/package.log
      - name: Verify installed DMG service and graphical startup
        timeout-minutes: 15
        working-directory: gchat
        run: >-
          python3 scripts/test-macos-bundle.py --build-manifest ../signed/build.json
          --native-receipt ../signed/provenance/native-ci.json
          --output ../signed/application-smoke --temp-parent /private/tmp --timeout 30
      - name: Bind retry result to original native inputs and separate controller
        timeout-minutes: 2
        env:
          TARGET: ${{ inputs.target }}
        run: >-
          python3 controller/scripts/macos-package.py finish --gchat gchat --gcoms gcoms
          --target "$TARGET" --output retry-evidence --signed signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.target }}-package
          include-hidden-files: true
          path: |
            signed/*.dmg
            signed/build/*/release/bundle/dmg/*.dmg
            signed/build.json
            signed/provenance/**
            signed/application-smoke/**
            retry-evidence/**
          if-no-files-found: error
