name: Verify retained iOS release
run-name: iOS retained verification ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      original_run_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string
      simulator_input:
        description: JSON containing successful simulator run/artifact/digest/controller/request identifiers
        required: true
        type: string
      gchat_commit:
        required: true
        type: string
      gcoms_commit:
        required: true
        type: string
      build_number:
        required: true
        type: string
      request_id:
        required: true
        type: string
      upload_testflight:
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-15
    environment: release-signing
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: source-gchat
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: source-gcoms
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Verify original IPA and completed same-source simulator lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_SIGNING_CERT_SHA256: ${{ vars.IOS_SIGNING_CERT_SHA256 }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          GCHAT_COMMIT: ${{ inputs.gchat_commit }}
          GCOMS_COMMIT: ${{ inputs.gcoms_commit }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SIMULATOR_INPUT: ${{ inputs.simulator_input }}
        run: |
          python3 -m unittest discover -s runner/scripts/tests -p 'ios*_test.py'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = {name: os.environ[name.upper()] for name in
                   ('artifact_sha256', 'gchat_commit', 'gcoms_commit', 'build_number')}
          value.update(run_id=int(os.environ['ORIGINAL_RUN_ID']), artifact_id=int(os.environ['ARTIFACT_ID']))
          value['simulator'] = json.loads(os.environ['SIMULATOR_INPUT'])
          Path('verification-input.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
          python3 runner/scripts/ios-verify-retained.py --spec verification-input.json \
            --gchat source-gchat --gcoms source-gcoms --output ios-verification
      - name: Upload unchanged verified device IPA to TestFlight processing
        if: ${{ success() && inputs.upload_testflight }}
        env:
          IOS_SIGNING_CERT_SHA256: ${{ vars.IOS_SIGNING_CERT_SHA256 }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 runner/scripts/ios-build.py upload --output ios-verification
      - name: Preserve original failure and separate verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-verified-${{ inputs.request_id }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            verification-input.json
            ios-verification/build.json
            ios-verification/publication.json
            ios-verification/simulator-artifact.zip
            ios-verification/simulator-run.json
            ios-verification/simulator-artifact.json
            ios-verification/simulator-original/ios-simulator-output/report.json
            ios-verification/simulator-original/ios-simulator-output/authority/
            ios-verification/simulator-original/ios-simulator-output/lifecycle/report.json
            ios-verification/simulator-original/ios-simulator-output/lifecycle/test-summary.json
            ios-verification/simulator-original/ios-simulator-output/lifecycle/xctest.log
            ios-verification/simulator-verification/
            ios-verification/original-*.json
            ios-verification/original-artifact.zip
            ios-verification/original/ios-output/build.json
            ios-verification/original/ios-output/signing-cleanup.json
            ios-verification/original/ios-output/*.ipa
            ios-verification/ipa-signer.der
            ios-verification/upload.json
            ios-verification/upload.log
