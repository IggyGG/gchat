name: macOS release worker
run-name: Forgejo macOS ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Base64 immutable coordinator manifest (optional for manual jobs)
        required: false
        type: string
      target:
        description: Native architectures to qualify (single-target retries retain their own scope)
        required: true
        type: choice
        default: both
        options: [both, macos-aarch64, macos-x86_64]
      gchat_ref:
        description: Protected main/release branch or approved version tag, exactly at gchat_commit
        required: true
        type: string
        default: main
      gcoms_ref:
        description: Protected main/release branch containing gcoms_commit, or an exact approved version tag
        required: true
        type: string
        default: main
      gchat_commit:
        required: true
        type: string
      gcoms_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  macos:
    environment: release-signing
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'both' && '["macos-aarch64","macos-x86_64"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ${{ matrix.target == 'macos-aarch64' && 'macos-15' || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify protected source commits
        env:
          GCHAT_COMMIT: ${{ inputs.gchat_commit }}
          GCOMS_COMMIT: ${{ inputs.gcoms_commit }}
          GCHAT_REF: ${{ inputs.gchat_ref }}
          GCOMS_REF: ${{ inputs.gcoms_ref }}
        run: >-
          python3 gchat/scripts/macos-build.py --verify-checkouts
          --gchat gchat --gcoms gcoms
          --gchat-commit "$GCHAT_COMMIT" --gcoms-commit "$GCOMS_COMMIT"
          --gchat-ref "$GCHAT_REF" --gcoms-ref "$GCOMS_REF"
      - name: Bind coordinated release identity
        env:
          GCHAT_RELEASE_MANIFEST_BASE64: ${{ inputs.release_manifest }}
        run: python3 gchat/scripts/release_input.py
      - name: Install pinned Rust, build tools and test loopback aliases
        timeout-minutes: 15
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, tomllib
          from pathlib import Path
          toolchains = [tomllib.loads(Path(name, 'rust-toolchain.toml').read_text())['toolchain'] for name in ('gchat', 'gcoms')]
          if toolchains[0] != toolchains[1]:
              raise SystemExit('paired sources must select the same pinned Rust toolchain')
          toolchain = toolchains[0]
          subprocess.run(['rustup', 'toolchain', 'install', toolchain['channel'], '--profile', toolchain.get('profile', 'minimal'),
                          '--component', ','.join(toolchain['components'])], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RUSTUP_TOOLCHAIN=' + toolchain['channel'] + '\n')
              # Darwin's default /var/folders path exceeds Unix socket limits.
              scratch = Path(tempfile.mkdtemp(prefix='gc-', dir='/private/tmp')).resolve()
              scratch.chmod(0o700)
              for name in ('TMPDIR', 'TMP', 'TEMP'):
                  output.write(name + '=' + str(scratch) + '\n')
          PY
          xcrun --sdk macosx --show-sdk-path
          clang --version
          brew install node@22 cmake
          echo "$(brew --prefix node@22)/bin" >> "$GITHUB_PATH"
          python3 gchat/scripts/macos-loopback.py
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Qualify both native workspaces with retained evidence
        timeout-minutes: 275
        run: |
          npm install --global npm@11
          python3 gchat/scripts/release-candidate.py init --gchat gchat --gcoms gcoms --target ${{ matrix.target }} --output native-evidence
          python3 gchat/scripts/release-candidate.py record --candidate native-evidence/candidate.json --gchat gchat --gcoms gcoms --project gchat --check native.gchat.${{ matrix.target }} --timeout 9000 -- python3 scripts/ci.py --gcoms ../gcoms --provenance-output ../native-evidence/paired-gchat
          python3 gchat/scripts/release-candidate.py record --candidate native-evidence/candidate.json --gchat gchat --gcoms gcoms --project gcoms --check native.gcoms.${{ matrix.target }} --timeout 7200 -- python3 scripts/ci.py
      - name: Build and verify the configured signing policy
        timeout-minutes: 45
        working-directory: gchat
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Movsai AB (U93DVTJ3T5)"
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 scripts/build-installer.py --target ${{ matrix.target }} --gcoms ../gcoms --native-ci-report ../native-evidence/paired-gchat/native-ci.json --output ../signed
      - name: Verify copied DMG application lifecycle and cleanup
        timeout-minutes: 15
        working-directory: gchat
        run: >-
          python3 scripts/test-macos-bundle.py
          --build-manifest ../signed/build.json
          --native-receipt ../signed/provenance/native-ci.json
          --output ../signed/application-smoke --temp-parent /private/tmp --timeout 30
      - name: Bind native artifact to coordinated release
        run: python3 gchat/scripts/release_attest.py --output signed --platform ${{ matrix.target }}
      - name: Retain native qualification evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          if Path('native-evidence').is_dir():
              Path('signed').mkdir(exist_ok=True)
              shutil.copytree('native-evidence','signed/evidence',dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.target }}
          include-hidden-files: true
          path: |
            signed/*.dmg
            signed/build/*/release/bundle/dmg/*.dmg
            signed/updater/**
            signed/updater-artifacts.json
            signed/build.json
            signed/release-binding.json
            signed/provenance/**
            signed/evidence/**
            signed/application-smoke/**
          if-no-files-found: error
