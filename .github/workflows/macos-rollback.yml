name: Retained Mac rollback
run-name: Mac retained rollback ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {type: string, required: true}
      target:
        type: choice
        required: true
        options: [macos-aarch64, macos-x86_64]
      artifacts:
        description: Exact source, run, archive hash and manifest bindings for current and baseline
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  rollback:
    runs-on: ${{ inputs.target == 'macos-aarch64' && 'macos-15' || 'macos-15-intel' }}
    environment: release-signing
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Validate rollback orchestration and bind immutable inputs
        env:
          ARTIFACT_INPUTS: ${{ inputs.artifacts }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 -m unittest scripts.tests.macos_rollback_test -v
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          value = json.loads(os.environ['ARTIFACT_INPUTS'])
          assert value['target'] == os.environ['TARGET']
          Path('rollback-inputs.json').write_text(json.dumps(value, indent=2))
          PY
      - name: Same-profile current to baseline to current with authenticated messages and retained files
        env:
          GH_TOKEN: ${{ github.token }}
          GCHAT_NETWORK_INVITATION: ${{ secrets.GCHAT_NETWORK_INVITATION }}
        run: python3 scripts/macos-rollback.py --inputs rollback-inputs.json --output rollback
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.target }}-rollback-${{ inputs.request_id }}
          path: |
            rollback-inputs.json
            rollback/report.json
            rollback/*.stdout
            rollback/*.stderr
            rollback/journey/*.log
          retention-days: 30
