name: Focused Mac catalog qualification
run-name: Mac catalog qualification ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      gcoms_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
      check:
        description: Fixed native assertion to investigate on unchanged protocol source
        type: choice
        default: catalog
        options: [catalog, machine-reopen]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: gchat
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          persist-credentials: false
      - name: Preflight exact source, native tools and loopback fixture
        env:
          EXPECTED_COMMIT: ${{ inputs.gcoms_commit }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path
          expected=os.environ['EXPECTED_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}',expected)
          assert subprocess.check_output(['git','-C','gcoms','rev-parse','HEAD'],text=True).strip()==expected
          toolchain=tomllib.loads(Path('gcoms/rust-toolchain.toml').read_text())['toolchain']['channel']
          subprocess.run(['rustup','toolchain','install',toolchain,'--profile','minimal'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RUSTUP_TOOLCHAIN='+toolchain+'\n')
          PY
          python3 gchat/scripts/macos-loopback.py
          mkdir evidence
          git -C gcoms rev-parse HEAD HEAD^{tree} > evidence/source.txt
      - name: Original pinned-source catalog tests
        if: ${{ inputs.check != 'machine-reopen' }}
        working-directory: gcoms
        run: |
          set -o pipefail
          cargo test -p gcoms-routing --all-features --locked --lib catalog::tests:: -- --test-threads=1 --nocapture 2>&1 | tee ../evidence/catalog.log
      - name: Repeat the original machine member cold-reopen assertion
        if: ${{ inputs.check == 'machine-reopen' }}
        working-directory: gcoms
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, tempfile, time
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from native_limits import prepare, disposable_mac_ports
          prepare()
          output = Path('../evidence')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          report = {'schema': 1, 'diagnostic_only': True, 'source': source, 'passed': False, 'checks': []}
          command = ['cargo', 'test', '-p', 'gcoms-node', '--all-features', '--locked', '--lib',
                     'node::persist::tests::component_authority_actual_signed_join_v15_migration_and_cold_member_reopen',
                     '--', '--exact', '--test-threads=1', '--nocapture']
          try:
              with tempfile.TemporaryDirectory(prefix='gc-', dir='/private/tmp') as temporary, disposable_mac_ports():
                  environment = dict(os.environ, TMPDIR=temporary, TMP=temporary, TEMP=temporary)
                  for attempt in range(5):
                      start = time.monotonic()
                      with (output / ('machine-reopen-' + str(attempt) + '.log')).open('wb') as log:
                          result = subprocess.run(command, env=environment, stdout=log,
                                                  stderr=subprocess.STDOUT, timeout=900)
                      counts = re.findall(r'test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored;',
                                          (output / ('machine-reopen-' + str(attempt) + '.log')).read_text())
                      passed = result.returncode == 0 and counts == [('ok', '1', '0', '0')]
                      report['checks'].append({'attempt': attempt, 'exit_code': result.returncode, 'passed': passed,
                                              'test_counts': counts, 'seconds': time.monotonic() - start})
                      if not passed:
                          break
              report['passed'] = len(report['checks']) == 5 and all(r['passed'] for r in report['checks'])
          finally:
              report['source_unchanged'] = (subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
                                          and not subprocess.check_output(['git', 'status', '--porcelain']))
              report['passed'] = report['passed'] and report['source_unchanged']
              (output / 'machine-reopen.json').write_text(json.dumps(report, indent=2) + '\n')
          if not report['passed']:
              raise SystemExit(1)
          PY
      - name: Retain result and unchanged source
        if: always()
        run: |
          git -C gcoms status --porcelain > evidence/source-after.txt
          test ! -s evidence/source-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-intel-catalog
          path: evidence/
          retention-days: 30
