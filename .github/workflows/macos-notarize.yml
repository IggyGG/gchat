name: macOS retained Developer ID notarization
run-name: Forgejo macOS notarize ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [macos-aarch64, macos-x86_64]
      kind:
        type: choice
        required: true
        options: [native, verified, resume]
      run_id:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      artifact_sha256:
        type: string
        required: true
      gchat_commit:
        type: string
        required: true
      gcoms_commit:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: gchat-retained-notarization-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  notarize:
    environment: release-signing
    runs-on: ${{ inputs.target == 'macos-aarch64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Re-sign retained application, notarize once and test Gatekeeper
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_ARTIFACT: ${{ inputs.artifact_id }}
          INPUT_SHA: ${{ inputs.artifact_sha256 }}
          GCHAT_COMMIT: ${{ inputs.gchat_commit }}
          GCOMS_COMMIT: ${{ inputs.gcoms_commit }}
          # New Developer ID certificate; do not replace old self-signed inputs.
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          python3 controller/scripts/macos-notarize-retained.py --kind "$INPUT_KIND" --target "$TARGET" --run-id "$INPUT_RUN" --artifact-id "$INPUT_ARTIFACT" --artifact-sha256 "$INPUT_SHA" --gchat gchat --gcoms gcoms --gchat-commit "$GCHAT_COMMIT" --gcoms-commit "$GCOMS_COMMIT" --output notarized --poll-seconds 600 2>&1 | tee notarization.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.target }}-notarized
          include-hidden-files: true
          path: |
            notarized/report.json
            notarized/publication.json
            notarized/controller.tar
            notarized/input.zip
            notarized/input-run.json
            notarized/input-artifact.json
            notarized/input/**
            notarized/signed/**
            notarized/logs/**
            notarized/entitlements/**
            notarized/resume-previous-report.json
            notarized/resume-input-run.json
            notarized/resume-input-artifact.json
            notarization.log
          if-no-files-found: error
