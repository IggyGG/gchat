name: iOS release worker
run-name: Forgejo iOS ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      gchat_ref:
        description: Protected main/release branch or approved tag at gchat_commit
        required: true
        type: string
        default: main
      gcoms_ref:
        description: Protected main/release branch containing gcoms_commit
        required: true
        type: string
        default: main
      gchat_commit:
        required: true
        type: string
      gcoms_commit:
        required: true
        type: string
      build_number:
        description: Unique Apple bundle version (major.minor.patch, e.g. 1.0.1)
        required: true
        type: string
      upload_testflight:
        description: Upload the verified IPA to App Store Connect; does not submit a public release
        required: true
        type: boolean
        default: false
      request_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    environment: release-signing
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify exact protected source pair before signing access
        env:
          GCHAT_COMMIT: ${{ inputs.gchat_commit }}
          GCOMS_COMMIT: ${{ inputs.gcoms_commit }}
          GCHAT_REF: ${{ inputs.gchat_ref }}
          GCOMS_REF: ${{ inputs.gcoms_ref }}
        run: >-
          python3 gchat/scripts/ios-build.py verify-checkouts
          --gchat gchat --gcoms gcoms
          --gchat-commit "$GCHAT_COMMIT" --gcoms-commit "$GCOMS_COMMIT"
          --gchat-ref "$GCHAT_REF" --gcoms-ref "$GCOMS_REF"
      - name: Prepare pinned native tools
        timeout-minutes: 15
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          pins = [tomllib.loads(Path(p, 'rust-toolchain.toml').read_text())['toolchain'] for p in ('gchat', 'gcoms')]
          if pins[0] != pins[1]:
              raise SystemExit('paired sources require the same pinned Rust toolchain')
          subprocess.run(['rustup', 'toolchain', 'install', pins[0]['channel'], '--profile', pins[0]['profile'],
                          '--component', ','.join(pins[0]['components'])], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('RUSTUP_TOOLCHAIN=' + pins[0]['channel'] + '\n')
          PY
          npm install --global npm@11.6.2
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v pod >/dev/null || brew install cocoapods
          python3 -m unittest discover -s gchat/scripts/tests -p ios_release_test.py
      - name: Build actual simulator app and signed device IPA
        timeout-minutes: 115
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SIGNING_CERT_SHA256: ${{ vars.IOS_SIGNING_CERT_SHA256 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -o pipefail
          python3 gchat/scripts/ios-build.py build --gchat gchat --gcoms gcoms --output ios-output \
            --build-number "$BUILD_NUMBER" 2>&1 | tee ios-worker.log
      - name: Upload verified IPA to TestFlight processing
        if: ${{ success() && inputs.upload_testflight }}
        timeout-minutes: 25
        env:
          IOS_SIGNING_CERT_SHA256: ${{ vars.IOS_SIGNING_CERT_SHA256 }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 gchat/scripts/ios-build.py upload --output ios-output
      - name: Retain source-bound success/failure evidence and IPA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-${{ inputs.gchat_commit }}-${{ inputs.gcoms_commit }}-${{ inputs.build_number }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            ios-worker.log
            ios-output/build.json
            ios-output/ios-config.json
            ios-output/*.ipa
            ios-output/distribution-certificate.der
            ios-output/ipa-signer.der
            ios-output/simulator-app.zip
            ios-output/signing-cleanup.json
            ios-output/features-*.txt
            ios-output/signing.xcconfig
            ios-output/ExportOptions-app-store.plist
            ios-output/device-build-settings.json
            ios-output/simulator-xcode/
            ios-output/device-xcode/
            ios-output/simulator-smoke/
            ios-output/simulator-signing/
            ios-output/paired/provenance/
            ios-output/paired/inputs/gchat/apps/client/src-tauri/gen/apple/build/*.xcarchive/
            ios-output/upload.json
            ios-output/upload.log
