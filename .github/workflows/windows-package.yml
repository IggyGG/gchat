name: Windows package recovery
run-name: Windows package recovery ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    environment: release-signing
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        # Child signing tools use Windows PowerShell. Keep its native module
        # path through Python rather than inheriting PowerShell 7 modules.
        shell: powershell
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GCHAT_ISOLATED_SIGNING_WORKER: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Keep source bytes and native paths portable
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3e09b2db471caf40ce6b0838ecc3000d5adfb644
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: 7eec615e4478a166ee71f3144bc04c3070c92f72
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Install Python measurement-test dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify and retain both original native passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/scripts/windows-package.py prepare --prior retained --gchat gchat --gcoms gcoms
      - name: Qualify disposable certificate import and cleanup
        timeout-minutes: 5
        run: ./gchat/scripts/test-windows-signing.ps1 -OutputDirectory signing-fixture
      - name: Preflight the existing pinned certificate before compilation
        timeout-minutes: 5
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          try {
            ./gchat/scripts/windows-signing.ps1 -Action Import -StateDirectory signing-preflight
          } finally {
            ./gchat/scripts/windows-signing.ps1 -Action Cleanup -StateDirectory signing-preflight
          }
      - name: Install pinned native tools and WebView prerequisites
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $Pinned = python -c "import pathlib,tomllib; a=tomllib.loads(pathlib.Path('gchat/rust-toolchain.toml').read_text())['toolchain']; b=tomllib.loads(pathlib.Path('gcoms/rust-toolchain.toml').read_text())['toolchain']; assert a == b, 'paired Rust toolchains differ'; print(a['channel'])"
          if ($LASTEXITCODE -ne 0) { throw 'Paired toolchain mismatch' }
          $Toolchain = $Pinned.Trim() + '-x86_64-pc-windows-msvc'
          rustup toolchain install $Toolchain --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MSVC toolchain installation failed' }
          $env:RUSTUP_TOOLCHAIN = $Toolchain
          "RUSTUP_TOOLCHAIN=$Toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          npm.cmd install --global npm@11.6.2
          if ($LASTEXITCODE -ne 0) { throw 'Pinned npm installation failed' }
          $VSWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $VS = & $VSWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VS) { throw 'Native Visual Studio x64 C++ tools are missing' }
          $SignTool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin/*/x64/signtool.exe') | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $SignTool) { throw 'Native Windows SDK signing tools are missing' }
          $SignTool.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $NSIS = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $NSIS)) { throw 'NSIS prerequisite is missing from the isolated worker' }
          Get-Command 7z.exe -ErrorAction Stop | Select-Object Source, Version | Format-Table -AutoSize
          & $NSIS /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'NSIS prerequisite is unusable' }
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake prerequisite is missing' }
          Get-Command gpg -All | Select-Object Source, Version | Format-Table -AutoSize
          gpg --version
          if ($LASTEXITCODE -ne 0) { throw 'GnuPG signature-test prerequisite is unusable' }
          python gchat/scripts/windows-build.py --prepare-webview --worker-evidence worker-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows/WebView prerequisite verification failed' }
      - name: Import only the existing pinned release certificate
        timeout-minutes: 5
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./gchat/scripts/windows-signing.ps1 -Action Import -StateDirectory signing-evidence
      - name: Build and verify signed NSIS
        timeout-minutes: 45
        working-directory: gchat
        run: |
          python ../controller/scripts/windows-package.py build --prior ../retained --gchat . --gcoms ../gcoms --output ../signed
          if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS build failed' }
      - name: Install, reopen, uninstall and clean up the actual application
        timeout-minutes: 15
        working-directory: gchat
        run: |
          python scripts/test-windows-installer.py --build-manifest ../signed/build.json --native-receipt ../signed/provenance/native-ci.json --output ../signed/application-smoke --timeout 30
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer/service lifecycle failed' }
      - name: Remove the imported private key and verify untouched trust stores
        if: always()
        timeout-minutes: 5
        run: ./gchat/scripts/windows-signing.ps1 -Action Cleanup -StateDirectory signing-evidence
      - name: Retain all native, installer and cleanup evidence
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path signed | Out-Null
          if (Test-Path -LiteralPath retained/original/native-evidence) { Copy-Item retained/original/native-evidence signed/native-evidence -Recurse -Force }
          if (Test-Path -LiteralPath retained/recovery-inputs.json) { Copy-Item retained/recovery-inputs.json signed/recovery-inputs.json }
          if (Test-Path -LiteralPath retained/original/reconstructed-native-config.json) { Copy-Item retained/original/reconstructed-native-config.json signed/reconstructed-native-config.json }
          git -C controller archive --format=tar -o ../signed/packaging-controller.tar HEAD
          foreach ($Name in @('native-evidence', 'worker-evidence', 'signing-evidence', 'signing-preflight', 'signing-fixture')) {
            if (Test-Path -LiteralPath $Name) { Copy-Item -LiteralPath $Name -Destination signed -Recurse -Force }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-x86_64
          path: |
            signed/*.exe
            signed/build.json
            signed/recovery.json
            signed/recovery-inputs.json
            signed/reconstructed-native-config.json
            signed/packaging-controller.tar
            signed/retained-build-outputs/**
            signed/provenance/**
            signed/native-evidence/**
            signed/worker-evidence/**
            signed/signing-evidence/**
            signed/signing-preflight/**
            signed/signing-fixture/**
            signed/application-smoke/**
          if-no-files-found: error
          include-hidden-files: true
