name: Linux release worker
run-name: Forgejo Linux ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      gchat_ref:
        required: true
        type: string
      gcoms_ref:
        required: true
        type: string
      gchat_commit:
        required: true
        type: string
      gcoms_commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
      release_manifest:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      artifact_sha256: ${{ steps.evidence.outputs.artifact-digest }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/linux-infrastructure-target
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Verify frozen workflow, sources and versions
        env:
          GCHAT_RELEASE_MANIFEST_BASE64: ${{ inputs.release_manifest }}
        run: python3 gchat/scripts/release_input.py
      - name: Identify compatible compiler inputs
        id: compiler
        run: python3 gchat/scripts/release_cache.py --scope services --github-output "$GITHUB_OUTPUT"
      - name: Restore shared trusted-main compiler cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.npm/_cacache
            ${{ steps.compiler.outputs.target }}
          key: ${{ steps.compiler.outputs.key }}
          restore-keys: |
            ${{ steps.compiler.outputs.restore_prefix }}
            ${{ steps.compiler.outputs.legacy_restore_key }}
      - name: Prepare native compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev
          python3 - <<'PYTHON'
          import os, subprocess, tomllib
          from pathlib import Path
          pins=[tomllib.loads(Path(p,'rust-toolchain.toml').read_text())['toolchain'] for p in ('gchat','gcoms')]
          assert pins[0]==pins[1]
          subprocess.run(['rustup','toolchain','install',pins[0]['channel'],'--profile','minimal'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('RUSTUP_TOOLCHAIN='+pins[0]['channel']+'\n')
          PYTHON
      - name: Build production services once and retain fixture hosts
        run: |
          python3 gchat/scripts/build-infrastructure.py --gcoms gcoms --output prebuilt/native-services --binaries-only
          python3 gcoms/scripts/build-fleet-files.py --gchat gchat --output prebuilt/relay-build --target-dir "$CARGO_TARGET_DIR" --fetch --relay-build prebuilt/native-services
      - name: Retain unsigned source-bound build
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-native-build-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 30
          path: |
            prebuilt/native-services/**
            prebuilt/relay-build/build.json
            prebuilt/relay-build/bin/**
          if-no-files-found: error
  relay-load:
    needs: [native-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Verify frozen workflow, sources and versions
        env:
          GCHAT_RELEASE_MANIFEST_BASE64: ${{ inputs.release_manifest }}
        run: python3 gchat/scripts/release_input.py
      - name: Prepare isolated native relay gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 ethtool tcpdump util-linux pkg-config libssl-dev
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          pins=[tomllib.loads(Path(p,'rust-toolchain.toml').read_text())['toolchain'] for p in ('gchat','gcoms')]
          assert pins[0]==pins[1]
          subprocess.run(['rustup','toolchain','install',pins[0]['channel'],'--profile','minimal'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('RUSTUP_TOOLCHAIN='+pins[0]['channel']+'\n')
          PY
          sudo -n unshare --net --mount --pid --fork --mount-proc -- true
      - name: Verify retained production and fixture build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 gchat/scripts/linux_build_artifacts.py
          --artifact-id "${{ needs.native-build.outputs.artifact_id }}"
          --sha256 "${{ needs.native-build.outputs.artifact_sha256 }}"
          --output prebuilt
      - name: Preflight then one 64-client relay campaign
        run: >-
          python3 gchat/scripts/relay_load_run.py
          --output relay-load-evidence
          --work "$RUNNER_TEMP/relay-load-work"
          --target-dir "$RUNNER_TEMP/unused-relay-target"
          --retained-build prebuilt
      - name: Retain original relay acceptance or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-load-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 30
          path: relay-load-evidence/**
          if-no-files-found: error
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      artifact_sha256: ${{ steps.evidence.outputs.artifact-digest }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/linux-gchat-target
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Install pinned Python measurement and transport test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.3.5 cryptography==50.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify frozen workflow, sources and versions
        env:
          GCHAT_RELEASE_MANIFEST_BASE64: ${{ inputs.release_manifest }}
        run: python3 gchat/scripts/release_input.py
      - name: Identify compatible compiler inputs
        id: compiler
        run: python3 gchat/scripts/release_cache.py --scope gchat --github-output "$GITHUB_OUTPUT"
      - name: Restore shared trusted-main compiler cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.npm/_cacache
            ${{ steps.compiler.outputs.target }}
          key: ${{ steps.compiler.outputs.key }}
          restore-keys: |
            ${{ steps.compiler.outputs.restore_prefix }}
            ${{ steps.compiler.outputs.legacy_restore_key }}
      - name: Prepare native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xvfb xauth gnupg minisign
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          pins=[tomllib.loads(Path(p,'rust-toolchain.toml').read_text())['toolchain'] for p in ('gchat','gcoms')]
          assert pins[0]==pins[1]
          subprocess.run(['rustup','toolchain','install',pins[0]['channel'],'--profile','minimal','--component','clippy,rustfmt'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('RUSTUP_TOOLCHAIN='+pins[0]['channel']+'\n')
          PY
          npm install --global npm@11.6.2
          if ! cargo deny --version 2>/dev/null | grep -qx "cargo-deny 0.20.2"; then cargo install cargo-deny --locked --version 0.20.2; fi
      - name: Qualify the frozen gchat native gate
        run: python3 gchat/scripts/release_linux_qualification.py qualify --scope gchat
      - name: Retain exact qualification and failure evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-qualification-gchat-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 30
          path: native-evidence/**
          if-no-files-found: error
  qualify-gcoms:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      artifact_sha256: ${{ steps.evidence.outputs.artifact-digest }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/linux-gcoms-target
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Install pinned Python measurement and transport test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.3.5 cryptography==50.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify frozen workflow, sources and versions
        env:
          GCHAT_RELEASE_MANIFEST_BASE64: ${{ inputs.release_manifest }}
        run: python3 gchat/scripts/release_input.py
      - name: Identify compatible compiler inputs
        id: compiler
        run: python3 gchat/scripts/release_cache.py --scope gcoms --github-output "$GITHUB_OUTPUT"
      - name: Restore shared trusted-main compiler cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.npm/_cacache
            ${{ steps.compiler.outputs.target }}
          key: ${{ steps.compiler.outputs.key }}
          restore-keys: |
            ${{ steps.compiler.outputs.restore_prefix }}
            ${{ steps.compiler.outputs.legacy_restore_key }}
      - name: Prepare native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xvfb xauth gnupg minisign
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          pins=[tomllib.loads(Path(p,'rust-toolchain.toml').read_text())['toolchain'] for p in ('gchat','gcoms')]
          assert pins[0]==pins[1]
          subprocess.run(['rustup','toolchain','install',pins[0]['channel'],'--profile','minimal','--component','clippy,rustfmt'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('RUSTUP_TOOLCHAIN='+pins[0]['channel']+'\n')
          PY
          npm install --global npm@11.6.2
          if ! cargo deny --version 2>/dev/null | grep -qx "cargo-deny 0.20.2"; then cargo install cargo-deny --locked --version 0.20.2; fi
      - name: Qualify the frozen gcoms native gate
        run: python3 gchat/scripts/release_linux_qualification.py qualify --scope gcoms
      - name: Retain exact qualification and failure evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-qualification-gcoms-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 30
          path: native-evidence/**
          if-no-files-found: error
  linux:
    needs: [qualify, qualify-gcoms, native-build]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/linux-infrastructure-target
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gchat_commit }}
          path: gchat
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: IggyGG/gcoms
          ref: ${{ inputs.gcoms_commit }}
          path: gcoms
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify frozen workflow, sources and versions
        env:
          GCHAT_RELEASE_MANIFEST_BASE64: ${{ inputs.release_manifest }}
        run: python3 gchat/scripts/release_input.py
      - name: Prepare native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xvfb xauth gnupg minisign
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          pins=[tomllib.loads(Path(p,'rust-toolchain.toml').read_text())['toolchain'] for p in ('gchat','gcoms')]
          assert pins[0]==pins[1]
          subprocess.run(['rustup','toolchain','install',pins[0]['channel'],'--profile','minimal','--component','clippy,rustfmt'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('RUSTUP_TOOLCHAIN='+pins[0]['channel']+'\n')
          PY
          npm install --global npm@11.6.2
      - name: Verify same-run qualification before signing
        env:
          GH_TOKEN: ${{ github.token }}
          GCHAT_QUALIFICATION_ARTIFACT_ID: ${{ needs.qualify.outputs.artifact_id }}
          GCHAT_QUALIFICATION_ARTIFACT_SHA256: ${{ needs.qualify.outputs.artifact_sha256 }}
          GCOMS_QUALIFICATION_ARTIFACT_ID: ${{ needs.qualify-gcoms.outputs.artifact_id }}
          GCOMS_QUALIFICATION_ARTIFACT_SHA256: ${{ needs.qualify-gcoms.outputs.artifact_sha256 }}
        run: >-
          python3 gchat/scripts/release_linux_qualification.py aggregate
          --gchat-artifact-id "$GCHAT_QUALIFICATION_ARTIFACT_ID"
          --gchat-sha256 "$GCHAT_QUALIFICATION_ARTIFACT_SHA256"
          --gcoms-artifact-id "$GCOMS_QUALIFICATION_ARTIFACT_ID"
          --gcoms-sha256 "$GCOMS_QUALIFICATION_ARTIFACT_SHA256"
      - name: Verify retained production and fixture build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 gchat/scripts/linux_build_artifacts.py
          --artifact-id "${{ needs.native-build.outputs.artifact_id }}"
          --sha256 "${{ needs.native-build.outputs.artifact_sha256 }}"
          --output prebuilt
      - name: Build signed Linux bundles
        env:
          GCHAT_RELEASE_KEY: F4F6F8550D2AA952A189640D58430838AA3230BB
          GCHAT_RELEASE_PASSPHRASE: ${{ secrets.GCHAT_RELEASE_PASSPHRASE }}
          GCHAT_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.GCHAT_RELEASE_PRIVATE_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gchat-signing"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          python3 - <<'PY'
          import os,base64,subprocess
          subprocess.run(['gpg','--batch','--import'],input=base64.b64decode(os.environ.pop('GCHAT_RELEASE_PRIVATE_KEY_BASE64'),validate=True),stdout=subprocess.DEVNULL,check=True)
          PY
          python3 gchat/scripts/build-installer.py --target linux-x86_64 --gcoms gcoms --native-ci-report native-evidence/paired-gchat/native-ci.json --retained-linux native-evidence/paired-gchat/linux-build --output signed
      - name: Retain qualified infrastructure binaries and image
        run: python3 gchat/scripts/build-infrastructure.py --gcoms gcoms --native-build prebuilt/native-services --output signed/infrastructure
      - name: Verify packaged profile lifecycle
        run: |
          dpkg-deb --extract signed/*.deb extracted
          python3 gchat/scripts/test-native-application.py --binary extracted/usr/bin/gchat-desktop --build-manifest signed/build.json --native-receipt signed/provenance/native-ci.json --output signed/application-smoke
          python3 gchat/scripts/test-native-cli.py --binary extracted/usr/bin/gchat --build-manifest signed/build.json --native-receipt signed/provenance/native-ci.json --output signed/cli-smoke
          python3 gchat/scripts/release_attest.py --output signed --platform linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ job.status == 'success' && 'linux-x86_64' || format('linux-build-failure-{0}', github.run_attempt) }}
          include-hidden-files: true
          path: |
            signed/*.deb
            signed/*.AppImage
            signed/*.asc
            signed/build.json
            signed/release-binding.json
            signed/provenance/**
            signed/updater/**
            signed/updater-artifacts.json
            signed/application-smoke/**
            signed/cli-smoke/**
            signed/infrastructure/**
            native-evidence/**
          if-no-files-found: error
