server {
  listen 8080;
  server_name _;
  root /state/public;
  autoindex off;
  location = /healthz { access_log off; return 200 'ok\n'; }
  location ~ /\. { deny all; }
  location ~ \.json$ { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location /updates/artifacts/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location /updates/apt/ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location / { try_files $uri =404; }
}
