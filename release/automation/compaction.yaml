apiVersion: batch/v1
kind: CronJob
metadata: {name: gchat-release-compaction}
spec:
  schedule: '17 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: gchat-release-compaction}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {app: gchat-release}
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: kubernetes.io/hostname, operator: NotIn, values: [triform-1]}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: compact
              image: GCHAT_RELEASE_IMAGE
              command: [python3, /opt/gchat/scripts/release_compaction.py, --state, /state]
              env: [{name: PYTHONDONTWRITEBYTECODE, value: '1'}]
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts: [{name: state, mountPath: /state}]
          volumes:
            - name: state
              persistentVolumeClaim: {claimName: gchat-release-state-hel}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gchat-release-compaction}
spec:
  podSelector:
    matchLabels: {app: gchat-release-compaction}
  policyTypes: [Ingress, Egress]
