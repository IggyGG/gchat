# cargo-deny policy for the GChat desktop developer preview. Run: cargo deny check
#
# Every duplicated major version doubles the audit and patch surface of a
# primitive we rely on. Duplicates are denied by default; the exceptions below
# are the openmls/hpke tree, which pins a newer RustCrypto generation than
# the rest of the workspace. Remove each skip when the workspace catches up.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is a GTK3 build macro via glib-macros and gtk3-macros; stable Tauri 2 retains GTK3; reviewed 2026-09-17 for this developer preview, revisit with the next stable Tauri upgrade or any remote capability change. No known runtime vulnerability is waived." },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9.0 is an unmaintained Unicode table through urlpattern 0.3 and tauri-utils 2.9.3. GChat grants no remote origin capabilities; check-source enforces that boundary; reviewed 2026-09-17 for this developer preview, revisit with the next stable Tauri upgrade or any remote capability change. No known runtime vulnerability is waived." },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9.0 is an unmaintained Unicode table through urlpattern 0.3 and tauri-utils 2.9.3. GChat grants no remote origin capabilities; check-source enforces that boundary; reviewed 2026-09-17 for this developer preview, revisit with the next stable Tauri upgrade or any remote capability change. No known runtime vulnerability is waived." },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9.0 is an unmaintained Unicode table through urlpattern 0.3 and tauri-utils 2.9.3. GChat grants no remote origin capabilities; check-source enforces that boundary; reviewed 2026-09-17 for this developer preview, revisit with the next stable Tauri upgrade or any remote capability change. No known runtime vulnerability is waived." },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9.0 is an unmaintained Unicode table through urlpattern 0.3 and tauri-utils 2.9.3. GChat grants no remote origin capabilities; check-source enforces that boundary; reviewed 2026-09-17 for this developer preview, revisit with the next stable Tauri upgrade or any remote capability change. No known runtime vulnerability is waived." },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9.0 is an unmaintained Unicode table through urlpattern 0.3 and tauri-utils 2.9.3. GChat grants no remote origin capabilities; check-source enforces that boundary; reviewed 2026-09-17 for this developer preview, revisit with the next stable Tauri upgrade or any remote capability change. No known runtime vulnerability is waived." },

    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 2.0.1 is build-time-only through hax-lib-macros 0.3.7 in OpenMLS/libcrux. Upstream has no replacement release; reviewed 2026-09-17, revisit before the next preview. No runtime vulnerability is waived." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots trust data; license bundled under third-party/
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    # Custom or unmaintained cryptography is forbidden (SPEC §8.1).
    { crate = "openssl", reason = "Native node TLS selects aws-lc; no OpenSSL backend" },
    { crate = "ring", wrappers = ["rustls-webpki", "rustls"], reason = "Ring is confined to the reviewed rustls/reqwest TLS dependency path" },
]
