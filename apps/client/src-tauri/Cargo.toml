[package]
name = "gchat-desktop"
version = "0.1.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.98"
description = "GChat desktop application for GComs"

[lib]
name = "gchat_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Make the explicit carrier option available in native installers. Selecting
# the runtime profile still requires --gc2-carrier; existing instances keep
# their current startup policy until an explicit migration is selected.
default = ["gc2-carrier"]
gc2-carrier = ["gchat-core/gc2-carrier"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gcoms-rpc = { version = "0.1.0" }
tauri = { version = "2", features = [] }
gchat-api = { version = "0.1.0", path = "../../../crates/chat-api" }
gchat-core = { version = "0.1.0", path = "../../../crates/core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Native dependencies stay outside the CLI workspace gates.
[workspace]
