[package]
name = "gchat-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gchat_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gcoms-rpc = { version = "0.1.0" }
tauri = { version = "2", features = [] }
gchat-api = { version = "0.1.0", path = "../../../crates/chat-api" }
gchat-core = { version = "0.1.0", path = "../../../crates/core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Native dependencies stay outside the CLI workspace gates.
[workspace]
