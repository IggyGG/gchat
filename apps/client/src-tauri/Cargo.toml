[package]
name = "gchat-desktop"
version = "0.1.4"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.98"
description = "GChat desktop application for GComs"

[lib]
name = "gchat_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Official desktop builds select GC/2 by default. --legacy-carrier explicitly
# selects compatibility mode; retained profile mismatches are never migrated
# or retried automatically. Builds without this feature retain the legacy default.
default = ["gc2-carrier"]
gc2-carrier = ["gchat-core/gc2-carrier"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gcoms = { version = "0.1.0", default-features = false, features = ["rpc", "files"] }
tauri = { version = "2", features = [] }
gchat-api = { version = "0.1.0", path = "../../../crates/chat-api" }
gchat-core = { version = "0.1.0", path = "../../../crates/core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tauri-plugin-dialog = "2.7"
tauri-plugin-deep-link = "2"
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "=2.12.0"
minisign-verify = "=0.2.5"
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
fs2 = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gchat-core = { version = "0.1.0", path = "../../../crates/core", features = ["mobile-push"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
tauri-plugin-gchat-mobile-platform = { version = "0.1.0", path = "mobile-platform" }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[dev-dependencies]
gchat-core = { version = "0.1.0", path = "../../../crates/core", features = ["mobile-push"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
tauri-plugin-gchat-mobile-platform = { version = "0.1.0", path = "mobile-platform" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

# Native dependencies stay outside the CLI workspace gates.
[workspace]
