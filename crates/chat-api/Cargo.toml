[package]
name = "gchat-api"
description = "Instance-bound gchat UI contract and IPC client"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["dep:tokio", "gcoms/ipc"]
wasm = ["gcoms/wasm"]

[dependencies]
gcoms = { version = "0.1.0", default-features = false }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
tokio = { optional = true, version = "1", features = ["time"] }

[[bin]]
name = "gchat-types"
path = "src/types.rs"
