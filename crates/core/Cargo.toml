[package]
name = "gchat-core"
description = "GC/1 channel-first client model and encrypted archive"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gchat-api = { version = "0.1.0", path = "../chat-api" }
gcoms-rpc = { version = "0.1.0" }
gcoms-core = { version = "0.1.0" }
gcoms-file-transfer = { version = "0.1.0" }
hmac = "0.12"
uuid = "1"
gcoms-node = { version = "0.1.0", features = ["client-persist"] }
gcoms-sdk = { version = "0.1.0" }
gcoms-crypto = { version = "0.1.0" }
gcoms-transport = { version = "0.1.0" }
gcoms-routing = { version = "0.1.0" }
gcoms-network-client = { version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "process", "io-util"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
fs2 = "0.4"
tempfile = "3"
async-trait = "0.1"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1"
url = "2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
axum = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = "0.26"

[features]
# Explicit opt-in: builds the experimental GC/2 carrier profile into this
# application. Default builds keep the GC/1 production profile.
gc2-carrier = ["gcoms-node/experimental-gc2", "gcoms-network-client/experimental-gc2"]
